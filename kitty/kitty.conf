# Powerlevel10k icons and powerline separators.
font_family IosevkaTermSlab Nerd Font

# Start with the window size captured on 2026-09-27.
remember_window_size no
initial_window_width 1835
initial_window_height 926
# Restore the position when Kitty is reopened.
remember_window_position yes


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# ---------- Transparency ----------
background_opacity 0.88
dynamic_background_opacity yes

# Linux compositor 支持的话可以有 blur
background_blur 20


# ---------- Window ----------
window_padding_width 8
hide_window_decorations yes


# ---------- Tab bar ----------
tab_bar_style powerline
tab_powerline_style slanted

tab_title_template "{title}"
active_tab_title_template "{title}"

tab_bar_align left
tab_bar_edge top

active_tab_font_style bold
inactive_tab_font_style normal

tab_bar_min_tabs 2

# ctrl+shift+enter 左右分屏（vsplit 需要 splits 布局）
enabled_layouts splits:split_axis=horizontal
map ctrl+shift+enter launch --location=vsplit --cwd=current

# Paste without confirmation prompts.
paste_actions quote-urls-at-prompt

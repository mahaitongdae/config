# 高度
lines 28
location top

# 半透明
background_opacity 0.90

# 失去焦点自动收起
# hide_on_focus_loss yes

# 始终浮在上层
layer overlay

# 可以单独覆盖 kitty 配置
kitty_override window_padding_width=10
kitty_override tab_bar_style=separator
kitty_override tab_bar_min_tabs=2

# Vertical split (side-by-side)
map ctrl+shift+enter launch --location=vsplit --cwd=current

# F11 在全屏和正常高度之间切换（逻辑见 toggle_qa_fullscreen.py）
kitty_override map=f11 kitten toggle_qa_fullscreen.py
